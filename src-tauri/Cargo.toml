[package]
name = "future-music-player"
version = "0.1.0"
description = "Multi-source desktop music player with Huawei Music asset sync"
authors = ["Future Music Team"]
edition = "2021"

[lib]
name = "future_music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.32"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
url = "2.5"
walkdir = "2.5"
lofty = "0.21"
quick-xml = "0.37"
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

